<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Lightfirm</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
        <nav class="navbar">
        <div class="logo">LIGHTFIRM</div>
        <div class="hamburger" id="hamburger">☰</div>
        <div class="nav-links" id="navLinks">
            <a href="/" class="active">Home</a>
            <a href="/portfolio">Portfolio</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
            <a href="/login" class="btn-small">Admin</a>
            </div>
    </nav>

    <section class="contact-section">
        <h1>Let's <span class="gradient-text">Talk</span></h1>
        <p>Have a project? Send a message - it goes straight to our email.</p>
        <p>timothyokanlawon99@gmail.com</p>
        <p>07049444886</p>
        <form id="contactForm" class="contact-form">
            <input type="text" id="c_name" placeholder="Your Name" required>
            <input type="email" id="c_email" placeholder="Your Email" required>
            <textarea id="c_message" placeholder="Your Project Details" rows="5" required></textarea>
            <button type="submit" class="btn-primary">Send Message</button>
            <p id="contactStatus"></p>
        </form>
    </section>

        <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    <script>
document.getElementById('contactForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  const status = document.getElementById('contactStatus');
  btn.textContent = 'Sending...';
  btn.disabled = true;
  status.textContent = 'Checking...';

  const payload = {
    name: document.getElementById('c_name').value.trim(),
    email: document.getElementById('c_email').value.trim(),
    message: document.getElementById('c_message').value.trim()
  };

  try {
    const res = await fetch('/api/contact', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });

    const text = await res.text(); // get raw HTML first
    console.log("RAW RESPONSE:", text);
    
    try {
      const result = JSON.parse(text);
      if(result.success){
        status.style.color = '#00ff88';
        status.textContent = '✅ Message sent!';
        e.target.reset();
      } else {
        status.style.color = '#ff4d5a';
        status.textContent = '❌ ' + (result.error || 'Failed');
      }
    } catch {
      // If not JSON, show first 300 chars of HTML
      status.style.color = '#ff4d5a';
      status.innerHTML = '❌ Server returned HTML, not JSON:<br><small style="color:#aaa">' + text.substring(0, 500) + '</small>';
      console.error(text);
    }
  } catch(err){
    status.textContent = '❌ Network error: ' + err.message;
  }
  btn.textContent = 'Send Message';
  btn.disabled = false;
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightfirm - Creative Graphic Studio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="logo">LIGHTFIRM</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/portfolio">Portfolio</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
            <a href="/admin" class="btn-small">Admin</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>We Make Brands <span class="gradient-text">Glow</span></h1>
            <p>Colorful. Bold. Unforgettable. Lightfirm is a graphic studio turning ideas into visuals that sell.</p>
            <div class="hero-btns">
                <a href="/portfolio" class="btn-primary">View Our Works</a>
                <a href="/contact" class="btn-outline">Hire Us</a>
            </div>
        </div>
        <div class="hero-shapes">
            <div class="shape shape1"></div>
            <div class="shape shape2"></div>
            <div class="shape shape3"></div>
        </div>
    </section>

    <section class="featured">
        <h2>Featured Works</h2>
        <div id="featuredGrid" class="portfolio-grid"></div>
        <a href="/portfolio" class="btn-outline center-btn">See All Works</a>
    </section>

    <footer>
        <p>© 2026 Lightfirm. Built with color.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        // Load 6 latest for homepage
        fetch('/api/portfolios').then(r=>r.json()).then(data=>{
            const grid = document.getElementById('featuredGrid');
            data.slice(0,6).forEach(item=>{
                grid.innerHTML += `<div class="card"><img src="${item.image_url}"><div class="card-info"><h4>${item.title}</h4><span>${item.category}</span></div></div>`;
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Lightfirm</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="icon" type="image/jpeg" href="/static/images/me.jpeg">
</head>
<body>
        <nav class="navbar">
        <div class="logo">LIGHTFIRM</div>
        <div class="hamburger" id="hamburger">☰</div>
        <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="/portfolio">Graphics</a>
            <a href="/analytics" class="active">Analytics</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
            <a href="/login" class="btn-small">Admin</a>
        </div>
    </nav>

    <section class="page-header">
        <h1>Our <span class="gradient-text">Portfolio</span></h1>
        <p>Many designs, one studio.</p>
        <div class="filters">
            <button class="filter-btn active" data-filter="All">All</button>
            <button class="filter-btn" data-filter="Logo">Logo</button>
            <button class="filter-btn" data-filter="Flyer">Flyer</button>
            <button class="filter-btn" data-filter="Brand Identity">Brand Identity</button>
            <button class="filter-btn" data-filter="Poster">Poster</button>
        </div>
    </section>

    <div id="portfolioGrid" class="portfolio-grid large"></div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <span class="close">&times;</span>
        <img id="lightboxImg">
        <div id="lightboxCaption"></div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>

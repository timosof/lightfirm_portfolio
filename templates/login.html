<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Lightfirm</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
.login-wrapper{max-width:420px;margin:80px auto;padding:40px;background:var(--card);border-radius:20px;border:1px solid #23233a}
.login-wrapper h2{font-size:32px;margin-bottom:10px;text-align:center}
.login-wrapper p{text-align:center;color:var(--muted);margin-bottom:25px}
.login-wrapper input{width:100%;margin-bottom:15px}
.login-wrapper button{width:100%}
@media(max-width:480px){
  .login-wrapper{margin:30px 5%;padding:25px}
}
</style>
</head>
<body>

<nav class="navbar">
<div class="logo">LIGHTFIRM</div>
<div class="hamburger" id="hamburger">☰</div>
<div class="nav-links" id="navLinks">
<a href="/">Home</a>
<a href="/portfolio">Portfolio</a>
<a href="/about">About</a>
<a href="/contact">Contact</a>
<a href="/login" class="btn-small active">Admin</a>
</div>
</nav>

<div class="login-wrapper">
<h2>Welcome Back</h2>
<p>Login to manage portfolio</p>

{% with messages = get_flashed_messages() %}
{% if messages %}
<div style="background:#2a1a1a;border:1px solid #ff4e4e;color:#ffaaaa;padding:10px;border-radius:10px;margin-bottom:15px;text-align:center">
{{ messages[0] }}
</div>
{% endif %}
{% endwith %}

<form method="POST">
<input type="email" name="email" placeholder="Admin Email" required>
<input type="password" name="password" placeholder="Password (timosoft26*)" required>
<button type="submit" class="btn-primary">Login</button>
</form>

<p style="margin-top:20px;font-size:13px"><a href="/" style="color:var(--muted)">← Back to Home</a></p>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
